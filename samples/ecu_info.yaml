# This is the sample ecu_info.yaml for a single x86_64 ECU setup.
# Please check ecu_info.yaml spec for more details: https://tier4.atlassian.net/l/cp/AGmpqFFc.
format_version: 1
ecu_id: autoware
bootloader: grub
available_ecu_ids:
  - autoware
# On the partition layout contract (bootloader: grub-verity or jetson-dpi), the DPI the
# image build installed; otaclient drives it and never names it itself:
# dpi_executable: /usr/local/sbin/rootfs-ua-dpi
